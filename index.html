<style>

    {key:'P', label:'ポジティブ感情', text:'「休みたい」という気持ちは本物。まずその気持ちを大切に', hl:false},
    {key:'E', label:'エンゲージメント', text:'完全リタイアの前に「週1〜2日だけ働く」形を試してみる', sub:'いきなりゼロにしなくていい。段階的に減らす選択肢がある', hl:true},
    {key:'R', label:'関係性', text:'仕事をやめた後の「つながり」を今から意識して作っておく', sub:'地域活動・ボランティア・趣味のコミュニティなど', hl:true},
    {key:'M', label:'意味', text:'「仕事をやめた後、何で自分は社会とつながるか」を言葉にしてみる', sub:'役割や意味を失うと、想定外のしんどさが来ることがある', hl:false},
    {key:'A', label:'達成', text:'個別相談で「リタイア後の生活設計」を一緒に考えてみる', hl:false},
  ], risk:true},
};

const RISKS = [
  '社会的孤立のリスク：仕事を通じた人間関係が突然なくなることで、孤独感が増すことがあります',
  '認知機能への影響：社会参加や知的刺激が減ることで、認知機能の低下が早まるという研究があります',
  '喪失感・虚無感：「役割がなくなった」という感覚が、予想以上のしんどさとして現れることがあります',
  '経済的リスク：長寿化が進む現代、思っていたより長い「仕事のない期間」が続く可能性があります',
  '「仕事以外の社会参加」という第三の道もあります：ボランティア・地域活動・趣味のコミュニティなど',
];

function diagnose(ans) {
  const body = Qs[0].opts[ans.body]?.val ?? 4;
  const mental = Qs[1].opts[ans.mental]?.val ?? 'like';
  const economy = Qs[2].opts[ans.economy]?.val ?? 2;
  const identity = Qs[3].opts[ans.identity]?.val ?? 2;
  const futureStyle = Qs[6].opts[ans.future_style]?.val ?? 'stay';
  const transform = Qs[7].opts[ans.transform]?.val ?? 1;
  if (futureStyle === 'retire') return 't7';
  if (body === 0 || mental === 'both' || futureStyle === 'rest') return 't6';
  if (transform >= 3 && economy >= 3 && identity === 0) return 't5';
  if (futureStyle === 'shift_new') return 't5';
  if (futureStyle === 'shift_same' || (body <= 2 && mental === 'like')) return 't4';
  if (futureStyle === 'move' || mental === 'relation') return 't3';
  if (mental === 'flat' && body <= 2) return 't2';
  if (body <= 2 && mental === 'like') return 't2';
  return 't1';
}

const permaColors = {P:'#E85D75', E:'#F5A623', R:'#27AE60', M:'#2980B9', A:'#8E44AD'};
let cur = 0, ans = {};

function render() {
  const q = Qs[cur];
  const total = Qs.length;
  const pct = Math.round((cur / total) * 100);
  const sel = ans[q.id];
  const selArr = q.multi ? (Array.isArray(sel) ? sel : []) : [];
  const canNext = q.multi ? selArr.length > 0 : sel !== undefined;

  const optsHtml = q.opts.map((o, i) => {
    let isSelected, badge = '';
    if (q.multi) {
      const idx = selArr.indexOf(i);
      isSelected = idx !== -1;
      if (isSelected) badge = `<span class="priority-badge">${idx+1}位</span>`;
    } else { isSelected = sel === i; }
    const marker = q.multi ? `<div class="opt-check"></div>` : `<div class="opt-dot"></div>`;
    return `<div class="opt${isSelected?' selected':''}" onclick="pick(${i})">
      ${marker}<div><div class="opt-text">${o.label}${badge}</div><div class="opt-sub">${o.sub}</div></div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="section-label">${q.axis}</div>
    <div class="question-title">${q.q}</div>
    <div class="${q.noteType==='accent'?'note-accent':'note-gray'}">${q.note}</div>
    <div class="options">${optsHtml}</div>
    <div class="nav">
      <button class="btn" onclick="go(-1)" ${cur===0?'disabled':''}>← 戻る</button>
      <span class="step-count">${cur+1} / ${total}</span>
      <button class="btn btn-primary" onclick="go(1)" ${!canNext?'disabled':''}>${cur===total-1?'結果を見る →':'次へ →'}</button>
    </div>`;
}

function pick(i) {
  const q = Qs[cur];
  if (q.multi) {
    let arr = Array.isArray(ans[q.id]) ? [...ans[q.id]] : [];
    const idx = arr.indexOf(i);
    if (idx !== -1) arr.splice(idx, 1);
    else if (arr.length < (q.maxSelect||3)) arr.push(i);
    ans[q.id] = arr;
  } else { ans[q.id] = i; }
  render();
}

function go(dir) {
  if (dir === 1) {
    const q = Qs[cur];
    const sel = ans[q.id];
    const ok = q.multi ? (Array.isArray(sel) && sel.length > 0) : sel !== undefined;
    if (!ok) return;
    if (cur === Qs.length - 1) { showResult(); return; }
  }
  cur = Math.max(0, cur + dir);
  render();
}

function showResult() {
  const typeKey = diagnose(ans);
  const t = TYPES[typeKey];
  const valueQ = Qs.find(x => x.id === 'value');
  const valueArr = Array.isArray(ans['value']) ? ans['value'] : [];
  const valueTags = valueArr.map(i => valueQ.opts[i]?.label).filter(Boolean);

  const permaHtml = t.perma.map(p => `
    <div class="perma-item${p.hl?' highlight':''}">
      <span class="perma-badge" style="background:${permaColors[p.key]}20;color:${permaColors[p.key]};border:1px solid ${permaColors[p.key]}50">${p.key}:${p.label}</span>
      <div><div class="perma-text">${p.text}</div>${p.sub?`<div class="perma-sub">${p.sub}</div>`:''}</div>
    </div>`).join('');

  const valueHtml = valueTags.length ? `
    <div class="block-title">あなたが働く目的（優先順）</div>
    <div class="value-tags">${valueTags.map((t,i)=>`<span class="value-tag">${i+1}位: ${t}</span>`).join('')}</div>` : '';

  const riskHtml = t.risk ? `
    <div class="risk-box">
      <div class="risk-title">⚠️ 完全リタイアの前に知っておいてほしいこと</div>
      ${RISKS.map(r=>`<div class="risk-item">${r}</div>`).join('')}
    </div>` : '';
  document.getElementById('app').innerHTML = `
    <div class="result-header" style="background:${t.bg}">
      <div class="result-type-tag" style="color:${t.color};border-color:${t.color}60;background:white">${t.label}</div>
      <div class="result-title" style="color:${t.color}">${t.label}</div>
      <div class="result-desc" style="color:${t.color}">${t.desc}</div>
      <div class="result-theory" style="color:${t.color}">理論的背景：${t.theory}</div>
    </div>
    ${valueHtml}
    <div class="block-title">今すぐできる次の一歩 — PERMAモデルより</div>
    <div class="perma-list">${permaHtml}</div>
    ${riskHtml}
    <div class="note-cta">
      <div class="note-cta-title">📝 この診断の理論的背景をもっと知りたい方へ</div>
      <div class="note-cta-desc">エリクソン・セリグマン・スーパーの理論と、40代女性の働き方の関係をnoteで詳しく解説しています。個別相談も受け付け中です。</div>
    </div>
    <button class="btn" onclick="restart()" style="margin-top:1.25rem;width:100%">← もう一度やり直す</button>`;
}

function restart() { cur = 0; ans = {}; render(); }
render();
</script>
</body>
</html>
